<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="会逐渐了解你衣橱、身材与审美的个人 AI 穿搭助手">
  <title>AI 穿搭助手</title>
  <!-- PWA：加到主屏幕后像原生 App（独立图标 / 全屏 / 无地址栏）。见 docs/ui-contract.md -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <!-- 两个都要写：标准名给 Chromium，apple- 前缀给 iOS（Chrome 会对只写 apple- 的版本报弃用警告）。 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="穿搭助手">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- 图标内联成 SVG（data URI）：省一个文件，也免掉浏览器自动请求
       /favicon.ico 造成的 404（首次加载时控制台会红一条）。 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230066cc'/%3E%3Cpath%20d='M10%209h12M16%209v15M12%2024h8'%20stroke='white'%20stroke-width='2.4'%20stroke-linecap='round'%20fill='none'/%3E%3C/svg%3E">
  <!-- token 层在前、组件层在后（层叠的直觉顺序）。变量只在 tokens.css 定义一处。 -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">AI 穿搭助手</div>
    <nav id="nav" class="nav" aria-label="主导航"></nav>
    <div id="status" class="status" title="服务与模型状态"></div>
  </header>

  <main id="view" class="view">
    <p class="muted">加载中…</p>
  </main>

  <!-- 手机端底部 tab 栏。和顶部 #nav 是**同一份导航的两种形态**：
       桌面显示 .nav（在顶栏里），手机显示 .tabbar（固定底部）。
       显示哪个由 CSS 决定；JS 两侧都渲染（见 app.js 的 renderNav）。 -->
  <nav id="tabbar" class="tabbar" aria-label="主导航"></nav>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/js/app.js"></script>

  <!-- ★ 启动看门狗（2026-10-21 加，2026-10-22 改判据）
       为什么必须是**内联**脚本：CSS / 模块脚本整批加载失败时，app.js 一行都不会执行，
       写在 app.js 里的兜底全部失效，页面永远停在"加载中…"。

       ★ 2026-10-22 第一版判据是错的，当天就改了。它看 `#view` 的文本里还有没有
         「加载中」，有就断言"后端没响应"。两件事根本不等价：
           · 覆盖安装后第一次启动：Python 侧字节码全重建（实测服务 4 秒才就绪），
             Service Worker 还要预缓存二十多个文件，9 秒后才画出内容是**正常**的；
           · app.js 的 boot() 是 health(6s 超时) → taxonomy(10s 超时) **串行**，
             最坏 16 秒才有内容，这期间它一直是"加载中…"；
           · 更糟的是"加载中"这三个字会**合法地**出现在正常页面里 —— 衣橱页点
             「加载更多」时按钮文字就是它。那时整页是好的，却被判成"没内容"
             被面板盖掉，数据回来写进的是**已经被换掉的节点**，页面就永久停在
             面板上，只能手动刷新。
         结论：**不能靠文本猜**。现在读 app.js 自己汇报的 `window.__wz.boot`
         （见 app.js 顶部注释）：missing / booting / ok / down，
         只有 missing 和 booting 才可能被动。

       文案也换过：原来让人"回桌面打开 Termux"，可 APK 里服务就是本应用的前台
       服务，桌面上没有 Termux 要开；真去开还会**再起一个服务抢 8787**
       （Termux 版 2026-10-22 起已弃用）。 -->
  <script>
    (function () {
      var FIRST = 9000;   // 先看一眼：正常路径这时首页已经画完
      var GRACE = 8000;   // 脚本活着但还在等数据时再给的时间（盖住 boot 最坏 16s）
      var PROBE = 4000;

      /** app.js 的启动状态 —— **唯一可信的判据**。
       *   missing : app.js 一行都没执行（模块加载失败 / 语法错误）
       *   booting : 在跑，还在等后端数据
       *   ok/down : 已经有结论（正常页面 / 后端指引页），一个字都不许改
       */
      function state() {
        return (window.__wz && window.__wz.boot) || "missing";
      }

      function settled() {
        var s = state();
        return s === "ok" || s === "down";
      }

      /** 问后端"你活着吗"。不用 fetch：内联脚本要能在最原始的环境里跑。 */
      function probeHealth(done) {
        var x = new XMLHttpRequest();
        var finished = false;
        function finish(ok) {
          if (finished) return;   // timeout 与 loadend 都会来，只认第一次
          finished = true;
          done(ok);
        }
        try {
          // /health 不在 SW 的外壳清单里（sw.js 只接管外壳与图片），走的是真网络。
          // 时间戳只是顺手绕开任何中间层缓存 —— sw.js 改了策略时也不会说谎。
          x.open("GET", "/health?probe=" + Date.now(), true);
          x.timeout = PROBE;
          x.onloadend = function () { finish(x.status === 200); };
          x.ontimeout = function () { finish(false); };
          x.onerror = function () { finish(false); };
          x.send();
        } catch (e) {
          finish(false);
        }
      }

      /** 清掉 SW 缓存与注册再重载。
       *
       * **只在"脚本压根没跑起来"时提供**：那个场景下缓存里八成是坏的，
       * 普通重试（location.reload）会一直拿到同一份坏外壳 —— 这个项目真发生过
       * （2026-10-22 装过一个带 SyntaxError 的包）。
       * 平时不该用：清了缓存，下次冷启动要多下一次外壳。
       */
      function hardReload() {
        var jobs = [];
        try {
          if (window.caches) {
            jobs.push(
              caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }).catch(function () {})
            );
          }
        } catch (e) { /* 没有 Cache API 就算了 */ }
        try {
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }).catch(function () {})
            );
          }
        } catch (e) { /* 同上 */ }
        var go = function () { location.reload(); };
        if (jobs.length) Promise.all(jobs).then(go, go);
        else go();
      }

      function show(kind) {
        if (settled()) return;    // ★ 探测这几百毫秒里 app.js 已出结论 → 绝不覆盖
        var v = document.getElementById("view");
        if (!v) return;
        var head =
          kind === "down" ? "后端没响应"
          : kind === "script" ? "页面脚本没加载起来"
          : "页面还没加载完";
        var body =
          kind === "down"
            ? "服务还在启动，或者已经被系统回收了。稍等几秒点重试；一直不行就去系统设置里对本应用「强制停止」，再打开一次（从最近任务里划掉不算）。"
            : kind === "script"
              ? "后端是通的（刚刚测过），是页面自己的脚本没跑起来 —— 最常见的原因是缓存里留着旧版本。点「清缓存重载」能修，之后会重新拉一遍。"
              : "后端是通的（刚刚测过），只是数据还没回来。第一次启动、或者刚更新完会慢一点；要是停在这一页不动，就点重试。";
        v.innerHTML =
          '<div class="panel" style="margin:16px">' +
          "<h2>" + head + "</h2>" +
          '<p class="faint">' + body + "</p>" +
          '<div class="form-actions">' +
          '<button type="button" class="primary" id="wd-retry">重试</button>' +
          (kind === "script"
            ? '<button type="button" class="ghost" id="wd-hard">清缓存重载</button>'
            : "") +
          "</div></div>";
        var a = document.getElementById("wd-retry");
        if (a) a.addEventListener("click", function () { location.reload(); });
        var b = document.getElementById("wd-hard");
        if (b) b.addEventListener("click", hardReload);
      }

      function check() {
        if (settled()) return;
        if (state() === "booting") {
          // 模块在跑，只是还在等数据（health 6s + taxonomy 10s 是串行）→ 再等等
          setTimeout(function () {
            if (settled()) return;
            probeHealth(function (ok) { show(ok ? "slow" : "down"); });
          }, GRACE);
          return;
        }
        // missing：模块一行都没跑。后端通不通，决定说"前端没起来"还是"后端没响应"
        probeHealth(function (ok) { show(ok ? "script" : "down"); });
      }

      setTimeout(check, FIRST);
    })();
  </script>
</body>
</html>
