org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# ── 本机工具链路径：换机器只改这里，别改 build.gradle ────────────────────
#
# ★ 路径必须**纯 ASCII 且尽量短**。Gradle / Chaquopy 在 Windows 上处理中文
#   路径会出转义问题 —— 这也是整个工程要铺到 C:/wbuild/aiw 去构建、
#   而不是直接在仓库目录里跑 Gradle 的原因。
#
# buildPython：Chaquopy 的构建期 Python，**必须与包内 Python 同为 3.14**
#   （Chaquopy 17 起强制 major.minor 一致）。本机默认环境是 3.13，所以单独装了 3.14。
#   跑 Gradle 前要清掉 PYTHONPATH / PYTHONHOME，否则会挤掉它自己的 Lib。
# aiw.buildPython 由 .local/toolchain.env 中 AIW_BUILD_PYTHON 指定。

# 离线 wheel 目录**不在这里配**：构建脚本会把仓库 android/wheels 覆盖同步到
# 构建目录，app/build.gradle 里用 "${rootDir}/wheels" 相对定位。
